services:
  postgres:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: sisenco
      POSTGRES_PASSWORD: sisenco123
      POSTGRES_DB: sisenco
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sisenco -d sisenco"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
